<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ReaShader</title>
	<link rel="icon" href="images/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="index.css" charset="UTF-8">

	<!-- plain scripts in dependency order: file:// blocks ES module imports -->
	<script defer src="scripts/api.js" charset="UTF-8"></script>
	<script defer src="scripts/ui.js" charset="UTF-8"></script>
	<script defer src="scripts/client.js" charset="UTF-8"></script>
</head>
<body>
	<div id="background"></div>
	<div id="logo" title="About ReaShader">
		<img src="images/reashader-logo-hr.png"/>
	</div>
	<div id="paramsContainer">
		<fieldset id="renderingDevice">
			<legend>Rendering Device</legend>
		</fieldset>
		<fieldset id="shader">
			<legend>Shader</legend>
			<div class="picker"></div>
			<div id="shaderStatus"><span class="spinner"></span><span class="text"></span></div>
			<div class="params"></div>
		</fieldset>
	</div>

	<!-- about box: opened by the logo, shows the 3D logo over the video while open -->
	<div id="about" class="modal" hidden>
		<div class="modal-box">
			<div class="modal-content">
				<button type="button" class="close" title="Close">&times;</button>
				<h2>ReaShader</h2>
				<p class="version"></p>
				<p class="tagline">GLSL shaders on REAPER with Vulkan</p>
				<dl class="credits">
					<dt>Author</dt><dd>Emanuele Messina</dd>
					<dt>License</dt><dd>MIT</dd>
				</dl>
				<a href="#" data-url="https://github.com/emanuelemessina/ReaShader">github.com/emanuelemessina/ReaShader</a>
			</div>
		</div>
	</div>
</body>
</html>
